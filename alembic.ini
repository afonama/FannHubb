# Alembic configuration.
#
# The database URL is NEVER stored here - env.py reads it from DATABASE_URL via
# app.core.config so the same config powers the app, the migrations, the seed
# script and the tests.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC

# Postpone writing DDL until a real connection is available (async engine).
revision_environment = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
